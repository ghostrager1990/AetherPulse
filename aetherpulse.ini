; AetherPulse Runtime Configuration File
; High-precision pacing and AMD FidelityFX Modular Runtime Bridge

[Upscaling]
Mode=Quality
NativeAA=false
ReactiveMask=true
RCASSharpening=true
Sharpness=0.35
MipLODBiasAuto=true
TextureLODBias=-0.58
ReactiveMaskSensitivity=0.10
ClampMinRenderScale=67

[RayRegeneration]
Enabled=true
NeuralRadianceCache=true
DenoiseReflections=true
DenoiseShadows=true
GlossyFilter=true
DisocclusionGhostingFilter=true
RoughnessThreshold=0.50
SpatialIterations=2
TemporalWeight=0.85
DepthSigma=1.00
NormalSigma=64.0
ForceAutoExposure=true
ColorSpaceCorrect=true

[FrameGeneration]
Enabled=true
MultiplierMode=Adaptive
TargetFPS=180
HUDProtection=true
AntiLag2=true
EnableHalfIntervalPacing=true
TargetFpsCap=0
EmaAlpha=0.125
SpinYieldMicroseconds=500
ForceFlipDiscard=true
MaxFrameLatency=1

[Telemetry]
EnableSharedMemory=true
UpdateIntervalMs=16

[Chaining]
EnableProxyChaining=true
OriginalDllPath=
